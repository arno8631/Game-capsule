# Déploiement « Blueprint » Render : Dashboard Render › New › Blueprint › ce dépôt GitHub.
services:
  - type: web
    name: ortho-invaders
    runtime: node
    plan: starter            # toujours allumé (le plan gratuit s'endort après 15 min : à éviter sur un salon)
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/config
    disk:                    # garde scores, gagnants et « déjà joué » entre deux redémarrages
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: SCREEN_KEY
        generateValue: true
      - key: AUTH_MODE
        value: storefront
      - key: SHOPIFY_STORE_DOMAIN
        value: capsule-med.com
      - key: SHOPIFY_ADMIN_DOMAIN
        value: capsule-med.myshopify.com
      - key: SHOPIFY_API_VERSION
        value: "2026-07"
      - key: STOREFRONT_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_APP_CLIENT_ID
        sync: false
      - key: SHOPIFY_APP_CLIENT_SECRET
        sync: false
      - key: STORE_ORIGINS
        value: https://capsule-med.com,https://www.capsule-med.com
      - key: MAX_PRIZES
        value: "30"
      - key: REWARD_VALIDITY_DAYS
        value: "60"
      - key: MIN_WIN_SECONDS
        value: "45"
      - key: PLAYER_TAGS
        value: jeuJO,jeuJO-2026
      - key: TESTER_IDS
        value: "23773949821273,23276575129945"
